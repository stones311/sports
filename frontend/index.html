<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SportSync｜運動場地即時查詢與揪團平台</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand-group">
          <div class="brand">
            <span class="brand-mark">🏃</span><span>SportSync</span>
          </div>
          <div class="brand-divider"></div>
          <div class="brand-subtitle">運動場地即時查詢與揪團平台</div>
        </div>
        <button
          class="profile-button"
          id="profileButton"
          aria-label="個人資訊"
          aria-expanded="false"
        >
          <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <circle
              cx="20"
              cy="20"
              r="17"
              fill="#e4f3ff"
              stroke="#4e8ab7"
              stroke-width="2.5"
            />
            <circle cx="20" cy="14" r="6" fill="#4e8ab7" />
            <path
              d="M8.5 31c1.8-6.4 5.7-9.3 11.5-9.3S29.7 24.6 31.5 31"
              fill="#4e8ab7"
            />
          </svg>
        </button>
        <div class="profile-menu" id="profileMenu">
          <button data-action="個人資料">👤　個人資料</button>
          <button data-action="我的行程">🗓️　我的行程</button>
          <button data-action="歷史紀錄">🕘　歷史紀錄</button>
          <button data-action="活動聊天室">💬　活動聊天室</button>
          <button data-action="通知設定">🔔　通知設定</button>
          <button data-action="登出">↪　登出</button>
        </div>
      </header>

      <section class="hero">
        <div class="hero-copy">
          <h1>一起運動，<br /><span>讓生活更有活力！</span></h1>
          <p>選擇喜愛的運動，或探索附近場地與即時揪團。</p>
        </div>
        <div class="hero-note">運動不孤單！<br />一起更精彩！</div>
      </section>

      <main>
        <section class="sports-section">
          <div class="section-heading">
            <div class="flame">♨</div>
            <h2>熱門運動</h2>
            <span class="en">Hot Sports</span>
            <button class="view-all" data-action="全部運動">
              查看全部 <span>→</span>
            </button>
          </div>
          <div class="sports-grid">
            <button
              class="sport-card"
              data-sport="籃球"
              aria-label="籃球 Basketball"
            >
              <img
                class="sport-image"
                src="https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=700&q=85"
                alt="籃球運動"
              />
              <div class="sport-info">
                <span class="sport-emoji">🏀</span
                ><span class="sport-label"
                  ><strong>籃球</strong><small>(Basketball)</small></span
                ><span class="arrow">→</span>
              </div>
            </button>
            <button
              class="sport-card"
              data-sport="羽球"
              aria-label="羽球 Badminton"
            >
              <img
                class="sport-image"
                src="https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?auto=format&fit=crop&w=700&q=85"
                alt="羽球運動"
              />
              <div class="sport-info">
                <span class="sport-emoji">🏸</span
                ><span class="sport-label"
                  ><strong>羽球</strong><small>(Badminton)</small></span
                ><span class="arrow">→</span>
              </div>
            </button>
            <button
              class="sport-card"
              data-sport="排球"
              aria-label="排球 Volleyball"
            >
              <img
                class="sport-image"
                src="https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?auto=format&fit=crop&w=700&q=85"
                alt="排球運動"
              />
              <div class="sport-info">
                <span class="sport-emoji">🏐</span
                ><span class="sport-label"
                  ><strong>排球</strong><small>(Volleyball)</small></span
                ><span class="arrow">→</span>
              </div>
            </button>
            <button
              class="sport-card"
              data-sport="其他運動"
              aria-label="其他運動 Other Sports"
            >
              <img
                class="sport-image"
                src="https://images.unsplash.com/photo-1517649763962-0c623066013b?auto=format&fit=crop&w=700&q=85"
                alt="其他運動器材"
              />
              <div class="sport-info">
                <span class="sport-emoji">➕</span
                ><span class="sport-label"
                  ><strong>其他運動</strong><small>(Other Sports)</small></span
                ><span class="arrow">→</span>
              </div>
            </button>
          </div>
        </section>

        <section class="features-band" aria-label="平台主要功能">
          <button class="feature-card" data-action="即時場地查詢">
            <span class="feature-icon">
              <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
                <path
                  d="M24 43s15-14.6 15-25A15 15 0 0 0 9 18c0 10.4 15 25 15 25Z"
                  fill="#0879b8"
                />
                <circle cx="24" cy="18" r="5.5" fill="white" />
              </svg>
            </span>
            <span class="feature-copy"
              ><strong>即時場地查詢</strong
              ><small
                >整合所有運動場地，查看附近場地、<br />位置、價格與可預約資訊。</small
              ></span
            >
            <span class="feature-arrow">→</span>
          </button>
          <button class="feature-card" data-action="即時揪團活動">
            <span class="feature-icon">
              <svg viewBox="0 0 48 48" fill="#0879b8" aria-hidden="true">
                <circle cx="24" cy="14" r="7" />
                <circle cx="10" cy="18" r="5.5" />
                <circle cx="38" cy="18" r="5.5" />
                <path d="M11 38v-4c0-7 5-11 13-11s13 4 13 11v4H11Z" />
                <path
                  d="M2 36v-3c0-5 3-8 8-8 2 0 4 .5 5.5 1.5A14 14 0 0 0 11 36v2H2v-2Zm44 0v-3c0-5-3-8-8-8-2 0-4 .5-5.5 1.5A14 14 0 0 1 37 36v2h9v-2Z"
                />
              </svg>
            </span>
            <span class="feature-copy"
              ><strong>即時揪團活動</strong
              ><small
                >瀏覽各類運動的揪團資訊，<br />查看時間、地點與剩餘名額。</small
              ></span
            >
            <span class="feature-arrow">→</span>
          </button>
          <button class="feature-card" data-action="我的運動">
            <span class="feature-icon">
              <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
                <rect
                  x="7"
                  y="11"
                  width="34"
                  height="31"
                  rx="5"
                  fill="#0879b8"
                />
                <rect
                  x="7"
                  y="17"
                  width="34"
                  height="25"
                  rx="4"
                  fill="#168fd0"
                />
                <path
                  d="M15 7v9M33 7v9"
                  stroke="#0879b8"
                  stroke-width="4"
                  stroke-linecap="round"
                />
                <circle cx="24" cy="29" r="7" fill="#dff2ff" />
                <path d="m22 25 7 4-7 4v-8Z" fill="#0879b8" />
              </svg>
            </span>
            <span class="feature-copy"
              ><strong>我的運動</strong
              ><small
                >管理行程、查看歷史紀錄，<br />並與團員保持聯繫。</small
              ></span
            >
            <span class="feature-arrow">→</span>
          </button>
        </section>
      </main>
      <div class="footer-note">
        SportSync © 2026　讓每一次運動，都更容易開始。
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script src="script.js"></script>
  </body>
</html>
